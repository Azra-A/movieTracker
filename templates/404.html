{% extends 'base.html' %}
{% block title %}Page not found | Movie Tracker{% endblock %}

{% block content %}
    <section class="page-shell">
        <div class="empty-state error-page">
            <span class="empty-icon" aria-hidden="true">✦</span>
            <p class="eyebrow">ERROR 404</p>
            <h1>We can’t find that page</h1>
            <p class="muted">The page may have moved, or the address may be incorrect.</p>
            <a class="button" href="{% url 'movies:home' %}">Back to the catalog</a>
        </div>
    </section>
{% endblock %}
