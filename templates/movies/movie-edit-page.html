{% extends 'base.html' %}
{% block title %}Edit {{ movie.title }} | Movie Tracker{% endblock %}

{% block content %}
    <section class="form-page">
        <div class="form-card">
            <p class="eyebrow">CATALOG</p>
            <h1>Edit movie</h1>
            <p class="muted">Update the details for {{ movie.title }}.</p>
            <form method="post" class="styled-form">
                {{ form.as_p }}
                {% csrf_token %}
                <div class="form-actions">
                    <button class="button" type="submit">Save changes</button>
                    <a class="button button-secondary" href="{% url 'movies:details' movie.pk %}">Cancel</a></div>
            </form>
        </div>
    </section>
{% endblock %}
